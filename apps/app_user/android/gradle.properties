org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
# Suppress Java source/target deprecation warnings
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# Force Gradle wrapper usage
org.gradle.wrapper.required=true
# Note: Remove org.gradle.java.home if you want Gradle to auto-detect Java
# Or set it to your actual Java installation path if needed
