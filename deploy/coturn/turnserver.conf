# turnserver.conf - Coturn TURN server configuration
# Uses long-term credentials (recommended for production)

listening-port=3478
tls-listening-port=5349

# Use long-term credentials (recommended for production)
lt-cred-mech

# Option A: Use static-auth-secret (HMAC shared secret) - recommended for scalable deployments
# Generate a long random secret: openssl rand -hex 32
# static-auth-secret=YOUR_LONG_RANDOM_SECRET_HERE

# Option B: Use static user(s) (less secure for production, but simpler for dev)
# Format: username:password
# user=testuser:testpass

# Realm and server name
realm=soulsupport.local
server-name=turn.soulsupport.local

# Log to stdout so docker logs capture it
log-file=stdout
simple-log

# Allow fingerprint attribute (for STUN/TURN protocol)
fingerprint

# Relay and external IP configuration
# If your server is behind NAT, set external-ip to your public IP
# external-ip=<PUBLIC_IP>
# relay-ip=0.0.0.0

# TLS certificates (optional) for secure TURN on port 5349
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Deny anonymous access in production
no-cli
no-stdout-log

# TURN relay port range (for media relay)
min-port=49152
max-port=65535

# Verbose logging (can be reduced in production)
verbose

